<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Siswa Digital</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    padding:30px;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.info{
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
}

.info p{
    margin:5px 0;
}

input,select{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}

.status-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:15px;
    text-align:center;
}

.card h2{
    font-size:22px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    text-align:center;
}

th{
    background:rgba(255,255,255,.1);
}

tr:nth-child(even){
    background:rgba(255,255,255,.05);
}

.success{
    margin-top:10px;
    text-align:center;
    color:#22c55e;
    font-weight:bold;
}

@media(max-width:600px){
    .status-box{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>
<body>

<div class="container">

<h1>📚 ABSENS
