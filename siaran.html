<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Daftar PR X-2</title>
<style>
body{font-family:'Poppins',sans-serif;background:#0f172a;color:#f1f5f9;margin:0;padding:20px;}
.container{max-width:600px;margin:auto;}
.card{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px;}
.tanggal{color:#93c5fd;font-size:0.9em;}
</style>
</head>
<body>
<div class="container">
<h1>📋 Daftar PR X-2</h1>
<div id="daftarPR"></div>
</div>

<script>
async function ambilPR(){
  try{
    const res = await fetch('pr.json?t='+Date.now());
    const data = await res.json();
    const container = document.getElementById('daftarPR');
    container.innerHTML = "";
    if(data.length===0){container.innerHTML="<p>Belum ada PR tersimpan.</p>";return;}
    data.forEach(pr=>{
      const div = document.createElement('div');
      div.className="card";
      div.innerHTML=`<h3>${pr.mapel}</h3><p>${pr.deskripsi}</p><p class="tanggal">📅 Deadline: ${pr.tanggal}</p>`;
      container.appendChild(div);
    });
  }catch(err){console.log("Error fetch PR:",err);}
}

ambilPR();
</script>
</body>
</html>
