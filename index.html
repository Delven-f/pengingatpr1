<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📘 Pengingat PR Offline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📘 Pengingat PR Offline</h1>
    <input type="text" id="search" placeholder="Cari mapel..." />
  </header>

  <main>
    <section id="form-section">
      <h2 id="form-title">Tambah PR</h2>
      <form id="pr-form">
        <input type="text" id="mapel" placeholder="Mata pelajaran" required />
        <textarea id="deskripsi" placeholder="Deskripsi PR" required></textarea>
        <input type="date" id="tanggal" required />
        <input type="hidden" id="pr-index" value="" />
        <div class="btn-group">
          <button type="submit">Simpan</button>
          <button type="button" id="cancel-btn" class="hidden">Batal</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Daftar PR</h2>
      <div id="daftarPR" class="list"></div>
    </section>
  </main>

  <footer>
    <small>📁 Data disimpan otomatis di browser kamu</small>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
