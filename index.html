<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 Pengingat PR X-2</title>
<link rel="stylesheet" href="style.css">
<style>
/* style sama seperti sebelumnya */
body{font-family:'Poppins',sans-serif;background:#0f172a;color:#f1f5f9;margin:0;padding:20px;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
h1{font-size:1.8em;}
#loginBtn{background:#3b82f6;border:none;color:white;padding:8px 14px;border-radius:10px;font-weight:bold;cursor:pointer;transition:.3s;}
#loginBtn:hover{background:#2563eb;}
.form-box{background:#1e293b;padding:20px;border-radius:15px;max-width:600px;margin:auto;box-shadow:0 0 15px rgba(0,0,0,.3);}
input,textarea,button{width:100%;margin-top:10px;padding:10px;border-radius:8px;border:none;font-size:1em;}
input,textarea{background:#334155;color:white;}
button{background:#3b82f6;color:white;font-weight:bold;cursor:pointer;transition:.3s;}
button:hover{background:#2563eb;}
button:disabled{background:#475569;cursor:not-allowed;}
.hapus-btn{background:#ef4444;}
.hapus-btn:hover{background:#dc2626;}
.list-container{margin-top:30px;max-width:600px;margin-left:auto;margin-right:auto;}
.card{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px;}
.tanggal{color:#93c5fd;font-size:0.9em;}
</style>
</head>
<body>
<header>
<h1>📘 Pengingat PR X-2</h1>
<button id="loginBtn" onclick="loginAdmin()">Login Admin</button>
</header>

<div class="form-box">
<input type="text" id="mapel" placeholder="Mata pelajaran" disabled>
<textarea id="deskripsi" placeholder="Deskripsi PR" disabled></textarea>
<input type="date" id="tanggal" disabled>
<button id="tambahBtn" onclick="tambahPR()" disabled>Tambah PR</button>
<button id="hapusBtn" class="hapus-btn" onclick="hapusSemuaPR()" disabled>🗑️ Hapus Semua PR</button>
</div>

<div class="list-container">
<h2>📋 Daftar PR Tersimpan:</h2>
<div id="daftarPR"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ================= CONFIG FIREBASE =================
const firebaseConfig = {
  apiKey: "API_KEY_FIREBASE",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================= LOGIN ADMIN =================
const passwordAdmin="firman1";
let adminMode=false;

function loginAdmin(){
  const pw=prompt("Masukkan sandi admin:");
  if(pw===passwordAdmin){
    adminMode=true;
    aktifkanAdmin();
    alert("✅ Login berhasil! Admin dapat menambah/hapus PR.");
    document.getElementById("loginBtn").innerText="Admin Aktif";
    document.getElementById("loginBtn").style.background="#16a34a";
  } else alert("❌ Sandi salah!");
}

function aktifkanAdmin(){
  document.getElementById("mapel").disabled=false;
  document.getElementById("deskripsi").disabled=false;
  document.getElementById("tanggal").disabled=false;
  document.getElementById("tambahBtn").disabled=false;
  document.getElementById("hapusBtn").disabled=false;
}

// ================= TAMPILKAN PR =================
const daftarPR = document.getElementById("daftarPR");
function tampilkanPR(data){
  daftarPR.innerHTML="";
  if(!data || data.length===0){daftarPR.innerHTML="<p>Belum ada PR tersimpan.</p>";return;}
  data.forEach(pr=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<h3>${pr.mapel}</h3><p>${pr.deskripsi}</p><p class="tanggal">📅 Deadline: ${pr.tanggal}</p>`;
    daftarPR.appendChild(div);
  });
}

// ================= AMBIL DATA REALTIME =================
db.ref('prList').on('value', snapshot=>{
  const data = snapshot.val();
  tampilkanPR(data ? Object.values(data) : []);
});

// ================= TAMBAH PR =================
function tambahPR(){
  if(!adminMode){alert("❌ Hanya admin bisa menambah PR"); return;}
  const mapel=document.getElementById("mapel").value;
  const deskripsi=document.getElementById("deskripsi").value;
  const tanggal=document.getElementById("tanggal").value;
  if(!mapel || !deskripsi || !tanggal){alert("⚠️ Isi semua kolom!"); return;}
  
  const newKey = db.ref().child('prList').push().key;
  db.ref('prList/' + newKey).set({mapel, deskripsi, tanggal});
  document.getElementById("mapel").value="";
  document.getElementById("deskripsi").value="";
  document.getElementById("tanggal").value="";
}

// ================= HAPUS SEMUA PR =================
function hapusSemuaPR(){
  if(!adminMode){alert("❌ Hanya admin bisa hapus PR"); return;}
  if(!confirm("⚠️ Yakin hapus semua PR?")) return;
  db.ref('prList').remove();
  alert("🗑️ Semua PR berhasil dihapus!");
}
</script>
</body>
</html>
