<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Admin Pengingat PR X-2</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #101820;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box, .admin-box {
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
    }
    h1 { text-align: center; }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
    }
    input, textarea {
      background: #374151;
      color: white;
    }
    button {
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div id="login" class="login-box">
    <h1>🔐 Login Admin</h1>
    <input type="password" id="password" placeholder="Masukkan sandi admin">
    <button onclick="login()">Masuk</button>
  </div>

  <div id="admin" class="admin-box" style="display:none;">
    <h1>📘 Tambah PR X-2</h1>
    <input type="text" id="mapel" placeholder="Mata pelajaran">
    <textarea id="deskripsi" placeholder="Deskripsi PR"></textarea>
    <input type="date" id="tanggal">
    <button onclick="tambahPR()">Tambah PR</button>
    <button onclick="siarkan()">📢 Siarankan</button>
    <button onclick="logout()" style="background:#ef4444;">Keluar</button>
  </div>

  <script>
    const passwordBenar = "firman1";

    function login() {
      const pw = document.getElementById("password").value;
      if (pw === passwordBenar) {
        sessionStorage.setItem("admin", "true");
        tampilkanAdmin();
      } else {
        alert("❌ Password salah!");
      }
    }

    function tampilkanAdmin() {
      document.getElementById("login").style.display = "none";
      document.getElementById("admin").style.display = "block";
    }

    function logout() {
      sessionStorage.removeItem("admin");
      location.reload();
    }

    function cekLogin() {
      if (sessionStorage.getItem("admin") === "true") {
        tampilkanAdmin();
      }
    }

    function tambahPR() {
      const mapel = document.getElementById("mapel").value;
      const deskripsi = document.getElementById("deskripsi").value;
      const tanggal = document.getElementById("tanggal").value;

      if (!mapel || !deskripsi || !tanggal) {
        alert("Isi semua kolom dulu ya!");
        return;
      }

      const prList = JSON.parse(localStorage.getItem("prList")) || [];
      prList.push({ mapel, deskripsi, tanggal });
      localStorage.setItem("prList", JSON.stringify(prList));

      alert("✅ PR berhasil ditambahkan!");
      document.getElementById("mapel").value = "";
      document.getElementById("deskripsi").value = "";
      document.getElementById("tanggal").value = "";
    }

    function siarkan() {
      const data = localStorage.getItem("prList");
      if (!data) {
        alert("Belum ada PR untuk disiarkan!");
        return;
      }
      localStorage.setItem("siaranPR", data);
      alert("📢 PR berhasil disiarkan ke publik!");
    }

    cekLogin();
  </script>
</body>
</html>
