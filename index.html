<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📘 Pengingat PR X-2 Modern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📘 Pengingat PR X-2</h1>
    <div class="admin-section">
      <button id="admin-login-btn">🔐 Admin Login</button>
      <span id="admin-status" class="hidden"></span>
      <button id="admin-logout-btn" class="hidden">Logout</button>
    </div>
  </header>
  
  <main>
    <section id="form-section" class="hidden">
      <h2 id="form-title">Tambah PR Baru</h2>
      <form id="pr-form">
        <input type="text" id="mapel" placeholder="Mata pelajaran" required>
        <textarea id="deskripsi" placeholder="Deskripsi PR" required></textarea>
        <input type="date" id="tanggal" required>
        <input type="hidden" id="pr-index">
        <div class="btn-group">
          <button type="submit" id="save-btn">Simpan</button>
          <button type="button" id="cancel-btn" class="hidden">Batal</button>
        </div>
      </form>
    </section>
    
    <section>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Cari PR..." autocomplete="off">
        <button id="refresh-btn" title="Refresh data">🔄</button>
        <button id="clear-btn" class="hidden hapus-btn" title="Hapus Semua PR">🗑️ Hapus Semua</button>
      </div>
      <div id="loading" class="loading hidden"></div>
      <div id="daftarPR"></div>
    </section>
  </main>
  
  <div id="toast" class="toast hidden"></div>
  
  <script src="app.js"></script>
</body>
</html>
